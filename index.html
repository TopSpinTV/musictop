<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Sonic</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
:root{--bg:#121212;--hi:#282828;--green:#1db954;--sub:#b3b3b3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 8px}
h1{font-size:24px;margin-bottom:12px}
h2{font-size:22px;margin:8px 0 4px}
.search{width:100%;padding:12px 16px;border-radius:24px;border:none;background:var(--hi);color:#fff;font-size:15px;outline:none}
main{flex:1;overflow-y:auto;padding:8px 8px 230px}
.item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;cursor:pointer}
.item:active,.item.on{background:var(--hi)}
.item img,.cover{width:56px;height:56px;border-radius:4px;object-fit:cover;flex-shrink:0}
.cover{background:linear-gradient(135deg,#450af5,#c4efd9);display:flex;align-items:center;justify-content:center;font-size:22px}
.meta{min-width:0;flex:1}
.t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on .t{color:var(--green)}
.s{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.more{font-size:20px;color:var(--sub);padding:4px 8px;flex-shrink:0}
.msg{color:var(--sub);text-align:center;padding:40px 16px;font-size:14px}
.btn{background:var(--hi);color:#fff;border-radius:20px;padding:10px 16px;font-size:14px;margin:8px 8px 8px 0}
.btn.green{background:var(--green);color:#000;font-weight:600}
.back{font-size:14px;color:var(--sub);padding:4px 0 8px}
.row-btns{margin:10px 0 12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--sub)}
nav.tabs button.on{color:#fff}
nav.tabs .ic{display:block;font-size:20px;margin-bottom:2px}
.player{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:#1f1f1f;padding:10px 12px;border-top:1px solid #000;z-index:4}
.now{display:flex;align-items:center;gap:10px}
.now img{width:44px;height:44px;border-radius:4px;object-fit:cover}
.now .info{flex:1;min-width:0}
.ctrl{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:6px}
button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.play{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;font-size:16px}
.qbtn{font-size:18px;color:var(--sub)}
input[type=range]{width:100%;margin-top:8px;accent-color:var(--green)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:10}
.sheet[hidden]{display:none}
.panel{background:#282828;width:100%;max-height:75dvh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #3a3a3a}
.ph b{font-size:16px}
.pl{overflow-y:auto;padding:6px 6px 14px}
.opt{display:block;width:100%;text-align:left;padding:14px 12px;font-size:15px;border-radius:6px}
.opt:active{background:#3a3a3a}
.opt.danger{color:#ff6b6b}
#yt{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1 id="title">Buscar</h1>
  <input class="search" id="q" placeholder="Artistas, canciones o podcasts" enterkeyhint="search" hidden>
</header>

<main id="view"></main>

<div class="player" id="bar" hidden>
  <div class="now">
    <img id="cover" alt="">
    <div class="info"><div class="t" id="ttl"></div><div class="s" id="art"></div></div>
    <button class="qbtn" id="openQ" aria-label="Cola">☰</button>
  </div>
  <div class="ctrl">
    <button id="prev" aria-label="Anterior">⏮</button>
    <button id="pp" class="play" aria-label="Reproducir">▶</button>
    <button id="next" aria-label="Siguiente">⏭</button>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0">
</div>

<nav class="tabs">
  <button data-tab="search" class="on"><span class="ic">🔍</span>Buscar</button>
  <button data-tab="library"><span class="ic">📚</span>Biblioteca</button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <div class="ph"><b id="sheetT"></b><button id="sheetX" aria-label="Cerrar">✕</button></div>
    <div class="pl" id="sheetL"></div>
  </div>
</div>
<div id="yt"></div>

<script>
let player;
let playlists = JSON.parse(localStorage.getItem('sonicPl') || '{}');
let results = [], queue = [], idx = -1, timer;
let tab = 'search', openPl = null, viewList = [], sheetFns = [];
const $ = s => document.querySelector(s);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const savePl = () => localStorage.setItem('sonicPl', JSON.stringify(playlists));

function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt', {
    height: '1', width: '1',
    playerVars: { playsinline: 1, controls: 0 },
    events: {
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) next();
        $('#pp').textContent = e.data === YT.PlayerState.PLAYING ? '❚❚' : '▶';
        clearInterval(timer);
        if (e.data === YT.PlayerState.PLAYING) timer = setInterval(progress, 500);
      },
      onError: () => next()
    }
  });
}

function getKey() {
  let k = localStorage.getItem('ytKey');
  if (!k) {
    k = (prompt('Pega tu API key de YouTube Data API v3:') || '').trim();
    if (k) localStorage.setItem('ytKey', k);
  }
  return k;
}

async function search(q) {
  const k = getKey();
  if (!k || !q.trim()) return;
  $('#view').innerHTML = '<p class="msg">Buscando…</p>';
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=25&q=${encodeURIComponent(q)}&key=${k}`;
  const d = await (await fetch(url)).json();
  if (d.error) {
    localStorage.removeItem('ytKey');
    $('#view').innerHTML = `<p class="msg">${esc(d.error.message)}</p>`;
    return;
  }
  results = (d.items || []).map(i => ({
    id: i.id.videoId,
    title: i.snippet.title,
    artist: i.snippet.channelTitle,
    img: i.snippet.thumbnails.medium.url
  }));
  renderView();
}

function trackRow(t, i, on) {
  return `<div class="item ${on ? 'on' : ''}" data-play="${i}">
    <img src="${t.img}" alt="">
    <div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div>
    <button class="more" data-more="${i}" aria-label="Más opciones">⋯</button>
  </div>`;
}

function renderView() {
  const cur = queue[idx] ? queue[idx].id : null;
  const v = $('#view');
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab && !openPl));
  if (openPl) {
    const pl = playlists[openPl];
    if (!pl) { openPl = null; return renderView(); }
    $('#title').textContent = pl.name;
    $('#q').hidden = true;
    viewList = pl.tracks;
    v.innerHTML = `
      <button class="back" data-back>← Biblioteca</button>
      <h2>${esc(pl.name)}</h2>
      <p class="s">${pl.tracks.length} canciones</p>
      <div class="row-btns">
        <button class="btn green" data-playall>▶ Reproducir</button>
        <button class="btn" data-delpl>Eliminar lista</button>
      </div>` +
      (pl.tracks.length ? pl.tracks.map((t, i) => trackRow(t, i, t.id === cur)).join('')
        : '<p class="msg">Esta lista está vacía. Añade canciones desde Buscar con el botón ⋯</p>');
  } else if (tab === 'search') {
    $('#title').textContent = 'Buscar';
    $('#q').hidden = false;
    viewList = results;
    v.innerHTML = results.length
      ? results.map((t, i) => trackRow(t, i, t.id === cur)).join('')
      : '<p class="msg">Busca música para empezar</p>';
  } else {
    $('#title').textContent = 'Biblioteca';
    $('#q').hidden = true;
    viewList = [];
    const ids = Object.keys(playlists);
    v.innerHTML = `
      <h2>Tus listas</h2>
      <button class="btn" data-newpl>+ Nueva lista</button>` +
      (ids.length ? ids.map(id => `
        <div class="item" data-open="${id}">
          <div class="cover">♪</div>
          <div class="meta"><div class="t">${esc(playlists[id].name)}</div>
          <div class="s">Lista · ${playlists[id].tracks.length} canciones</div></div>
        </div>`).join('')
        : '<p class="msg">Aún no tienes listas. Crea una para guardar canciones.</p>');
  }
}

function createPl() {
  const name = (prompt('Nombre de la lista') || '').trim();
  if (!name) return null;
  const id = Date.now().toString(36);
  playlists[id] = { name, tracks: [] };
  savePl();
  return id;
}

function addToPl(id, t) {
  const pl = playlists[id];
  if (!pl.tracks.some(x => x.id === t.id)) pl.tracks.push(t);
  savePl();
}

function openSheet(title, items) {
  $('#sheetT').textContent = title;
  sheetFns = items;
  $('#sheetL').innerHTML = items.map((it, i) =>
    `<button class="opt ${it.danger ? 'danger' : ''}" data-o="${i}">${esc(it.label)}</button>`).join('');
  $('#sheet').hidden = false;
}

function openQueue() {
  $('#sheetT').textContent = 'Cola de reproducción';
  sheetFns = [];
  $('#sheetL').innerHTML = queue.length
    ? queue.map((t, i) => `
      <div class="item ${i === idx ? 'on' : ''}" data-qplay="${i}">
        <img src="${t.img}" alt="">
        <div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div>
        <button class="more" data-qdel="${i}" aria-label="Quitar de la cola">✕</button>
      </div>`).join('')
    : '<p class="msg">La cola está vacía</p>';
  $('#sheet').hidden = false;
}

function closeSheet() { $('#sheet').hidden = true; }

function playList(list, i) {
  queue = list.slice();
  playIdx(i);
}

function playIdx(i) {
  if (i < 0 || i >= queue.length) return;
  idx = i;
  const t = queue[i];
  player.loadVideoById(t.id);
  $('#bar').hidden = false;
  $('#cover').src = t.img;
  $('#ttl').textContent = t.title;
  $('#art').textContent = t.artist;
  renderView();
}

function next() { playIdx(idx + 1); }
function prev() { playIdx(idx - 1); }

function progress() {
  const dur = player.getDuration(), cur = player.getCurrentTime();
  if (dur > 0) $('#seek').value = Math.round((cur / dur) * 1000);
}

$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.target.blur(); search(e.target.value); }
});

document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  openPl = null;
  renderView();
});

$('#view').addEventListener('click', e => {
  const t = e.target;
  const more = t.closest('[data-more]');
  if (more) {
    const track = viewList[+more.dataset.more];
    if (openPl) {
      const i = +more.dataset.more;
      openSheet(track.title, [
        { label: 'Quitar de la lista', danger: true, fn: () => {
          playlists[openPl].tracks.splice(i, 1); savePl(); renderView();
        }}
      ]);
    } else {
      const items = Object.keys(playlists).map(id => ({
        label: `Añadir a ${playlists[id].name}`,
        fn: () => addToPl(id, track)
      }));
      items.push({ label: '+ Nueva lista', fn: () => {
        const id = createPl();
        if (id) addToPl(id, track);
      }});
      openSheet('Añadir a lista', items);
    }
    return;
  }
  if (t.closest('[data-play]')) return playList(viewList, +t.closest('[data-play]').dataset.play);
  if (t.closest('[data-open]')) { openPl = t.closest('[data-open]').dataset.open; return renderView(); }
  if (t.closest('[data-back]')) { openPl = null; return renderView(); }
  if (t.closest('[data-playall]') && viewList.length) return playList(viewList, 0);
  if (t.closest('[data-delpl]')) {
    if (confirm(`¿Eliminar la lista "${playlists[openPl].name}"?`)) {
      delete playlists[openPl]; savePl(); openPl = null; renderView();
    }
    return;
  }
  if (t.closest('[data-newpl]')) { createPl(); renderView(); }
});

$('#sheetL').addEventListener('click', e => {
  const t = e.target;
  const q = t.closest('[data-qplay]');
  const d = t.closest('[data-qdel]');
  const o = t.closest('[data-o]');
  if (d) {
    const i = +d.dataset.qdel;
    queue.splice(i, 1);
    if (i <= idx) idx--;
    return openQueue();
  }
  if (q) { playIdx(+q.dataset.qplay); return closeSheet(); }
  if (o) {
    const fn = sheetFns[+o.dataset.o].fn;
    closeSheet();
    fn();
    renderView();
  }
});

$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
$('#sheetX').onclick = closeSheet;
$('#openQ').onclick = openQueue;

$('#pp').onclick = () => {
  if (!player) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
};
$('#next').onclick = next;
$('#prev').onclick = prev;
$('#seek').oninput = e => player.seekTo((e.target.value / 1000) * player.getDuration(), true);

renderView();
</script>
</body>
</html>
